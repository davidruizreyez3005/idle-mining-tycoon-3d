# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon — tuned for memory-constrained build machines
# (local sandbox 4GB, GitHub Actions 2-core runners). The Kotlin compiler runs
# in-process to avoid a second heavy JVM.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process

# Build performance (parallelism is pointless for a single-module build).
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin style.
kotlin.code.style=official

# KGP 2.4 warns that Gradle 8.14.3 support ends with Kotlin 2.5 — harmless for this
# build (AGP 8.13.2 pairs with Gradle 8.13+). Remove when the toolchain is upgraded.
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
