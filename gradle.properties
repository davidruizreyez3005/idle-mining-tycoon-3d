# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon (memory-constrained CI machines: 2.5GB cap,
# Kotlin compiler runs in-process to avoid a second heavy daemon).
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process

# Build performance.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin style.
kotlin.code.style=official

# KGP 2.4 warns that Gradle 8.14.3 support ends with Kotlin 2.5 — harmless for this
# build (AGP 8.13.2 pairs with Gradle 8.13+). Remove when upgrading the toolchain.
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
