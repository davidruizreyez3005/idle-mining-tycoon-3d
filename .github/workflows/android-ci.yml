name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true
      - name: Build with Gradle
        run: ./gradlew assembleDebug || ./gradlew build
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: idle-mining-apk
          path: app/build/outputs/apk/debug/app-debug.apk || true
