name: Android Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One build per ref — a new push cancels the superseded run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, test, release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + build APKs
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mining-tycoon-3d-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mining-tycoon-3d-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # ------------------------------------------------------------------ release
      # Runs only on pushes to main. Recreates the v0.2.0 release each time so
      # there is always exactly one canonical "latest" build. Uses the built-in
      # GITHUB_TOKEN — no personal credentials in CI.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.2.0
        run: |
          set -e
          cp app/build/outputs/apk/release/app-release.apk MiningTycoon3D-v0.2.0.apk
          # Replace any previous release at this tag (idempotent re-publish).
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Mining Tycoon 3D — Phase 2 v0.2.0" \
            --notes "Automated build from $GITHUB_SHA (run $GITHUB_RUN_NUMBER).

          **Install:** download \`MiningTycoon3D-v0.2.0.apk\` below, allow installs from your browser, and play.

          **Phase 2 — cinematic presentation:**
          - Fixed cinematic camera (authored angle, soft worker follow — no more gesture orbit)
          - Warm sun + cool sky fill with soft 2048px shadows
          - Distance fog with sun in-scattering and mountain backdrop — real depth
          - PBR materials: metallic steel/gold, matte rock, polished ore crystals
          - ACES tone mapping, bloom, vignette and SSAO
          - All presentation data-driven from world.json (per-zone moods)

          Plus the full vertical slice: 4 resources, 11 veins, upgrades, idle earnings, saves." \
            --latest \
            "MiningTycoon3D-v0.2.0.apk"
