name: Android Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One build per ref — a new push cancels the superseded run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, test, release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + build APKs
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mining-tycoon-3d-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mining-tycoon-3d-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # ------------------------------------------------------------------ release
      # Runs only on pushes to main. Recreates the v0.3.0 release each time so
      # there is always exactly one canonical "latest" build. Uses the built-in
      # GITHUB_TOKEN — no personal credentials in CI.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.3.0
        run: |
          set -e
          cp app/build/outputs/apk/release/app-release.apk MiningTycoon3D-v0.3.0.apk
          # Replace any previous release at this tag (idempotent re-publish).
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Mining Tycoon 3D — Phase 3 v0.3.0" \
            --notes "Automated build from $GITHUB_SHA (run $GITHUB_RUN_NUMBER).

          **Install:** download \`MiningTycoon3D-v0.3.0.apk\` below, allow installs from your browser, and play.

          **Phase 3 — economy depth + upgrade abilities:**
          - Locked 45° orthographic camera: drag to pan, pinch to zoom, angle never changes
          - Blur/vignette frame removed — clean, unframed viewport edges
          - Dynamic market: resource prices drift on live sine waves — time your sells (new MARKET panel with trend arrows)
          - New resources: Silver and Crystal, with new veins placed in the quarry
          - Lucky Strikes upgrade: chance for double loot when a vein breaks
          - Warehouse upgrade: offline earnings cap extends 2h per level
          - Auto-Extractor now mines silver (level 7) and crystal (level 10)

          Plus the full vertical slice: 6 resources, 15 veins, upgrades, idle earnings, saves." \
            --latest \
            "MiningTycoon3D-v0.3.0.apk"
